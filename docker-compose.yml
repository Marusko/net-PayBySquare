services:
  paybysquare:
    image: marusko/paybysquare:latest
    container_name: paybysquare
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: "Europe/Bratislava"
      # Voliteľné – vyžaduje hlavičku X-Api-Key na /api/* endpointoch:
      # PBS_API_KEY: "zmente-ma"
      # Voliteľné – limit požiadaviek na klienta za minútu:
      # PBS_RATE_LIMIT: "120"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3