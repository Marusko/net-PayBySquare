services:
  paybysquare:
    image: marusko/paybysquareapi:latest
    container_name: paybysquare
    restart: unless-stopped
    ports:
      - 8080:8080
    environment:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      APP_UID: 1654
      ASPNETCORE_HTTP_PORTS: 8080
      DOTNET_RUNNING_IN_CONTAINER: true
      DOTNET_VERSION: 10.0.12
      ASPNET_VERSION: 10.0.12
      TZ: "Europe/Bratislava"
      # Voliteľné – vyžaduje hlavičku X-Api-Key na /api/* endpointoch:
      # PBS_API_KEY: "zmente-ma"
      # Voliteľné – limit požiadaviek na klienta za minútu:
      # PBS_RATE_LIMIT: "120"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
